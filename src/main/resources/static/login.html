<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <!-- Ambient Animated Pastel Spheres -->
    <div class="ambient-bg">
        <div class="sphere sphere-1"></div>
        <div class="sphere sphere-2"></div>
        <div class="sphere sphere-3"></div>
    </div>

    <!-- Soft Cream Auth Canvas Card -->
    <div class="auth-canvas">
        <div class="auth-brand">
            <div class="brand-icon-circle"><i class="fa-solid fa-graduation-cap"></i></div>
            <h1>Welcome Back</h1>
            <p>Sign in to your student management account</p>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="input-field-group">
                <input type="text" id="username" placeholder="Username" required autocomplete="username">
                <i class="fa-regular fa-user"></i>
            </div>

            <div class="input-field-group">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                <i class="fa-solid fa-lock"></i>
            </div>

            <div id="errorMsg" class="error"></div>

            <button type="submit">Sign In <i class="fa-solid fa-arrow-right" style="margin-left: 6px;"></i></button>
        </form>

        <div class="auth-footer-link">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
