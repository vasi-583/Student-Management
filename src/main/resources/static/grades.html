<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grades - Student Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <h2>Student MS</h2>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="index.html">Students</a>
                <a href="courses.html">Courses</a>
                <a href="attendance.html">Attendance</a>
                <a href="grades.html" class="active">Grades</a>
            </nav>
            <div class="logout-link" id="logoutBtn">Logout</div>
        </div>

        <div class="main">
            <div class="page-header">
                <h1>Grades</h1>
            </div>

            <div class="card">
                <form id="gradeForm">
                    <input type="hidden" id="gradeId">
                    <select id="studentSelect" required>
                        <option value="">Select Student</option>
                    </select>
                    <input type="text" id="subject" placeholder="Subject" required>
                    <input type="number" id="marks" placeholder="Marks" required min="0" step="0.5">
                    <input type="number" id="maxMarks" placeholder="Max Marks" required min="1" step="0.5" value="100">
                    <button type="submit" id="submitBtn">Add Grade</button>
                </form>
            </div>

            <div class="card">
                <table id="gradeTable">
                    <thead>
                        <tr><th>ID</th><th>Student</th><th>Subject</th><th>Marks</th><th>Percentage</th><th>Actions</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="grades.js"></script>
</body>
</html>
