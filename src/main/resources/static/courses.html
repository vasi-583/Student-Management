<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - Student Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <h2>Student MS</h2>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="index.html">Students</a>
                <a href="courses.html" class="active">Courses</a>
                <a href="attendance.html">Attendance</a>
                <a href="grades.html">Grades</a>
            </nav>
            <div class="logout-link" id="logoutBtn">Logout</div>
        </div>

        <div class="main">
            <div class="page-header">
                <h1>Courses</h1>
            </div>

            <div class="card">
                <form id="courseForm">
                    <input type="hidden" id="courseId">
                    <input type="text" id="courseName" placeholder="Course Name" required>
                    <input type="text" id="courseDescription" placeholder="Description">
                    <button type="submit" id="submitBtn">Add Course</button>
                </form>
            </div>

            <div class="card">
                <table id="courseTable">
                    <thead>
                        <tr><th>ID</th><th>Name</th><th>Description</th><th>Actions</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="courses.js"></script>
</body>
</html>
